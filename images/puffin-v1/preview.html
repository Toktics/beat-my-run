<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beat My Run — puffin animation preview</title>
<style>
body{margin:0;background:#1a211d;color:#eee6c9;font:16px system-ui;padding:24px}main{max-width:1152px;margin:auto}h1{font-size:24px}p{line-height:1.5}section{display:flex;flex-wrap:wrap;gap:24px}.stage{width:288px;height:256px;background:#cdd1b9;border-radius:12px;position:relative;overflow:hidden}.stage:after{content:'';position:absolute;top:232px;left:0;right:0;border-top:2px solid #59614d}.stage img{width:288px;height:256px;position:relative;z-index:1}.ghost img{filter:grayscale(1);opacity:.32}button{background:#eee6c9;color:#1a211d;border:0;border-radius:8px;padding:10px 14px;margin:4px;cursor:pointer}button[aria-pressed=true]{background:#f58518}.sheet{width:100%;height:auto;margin-top:24px;border-radius:12px}label{display:block;margin:16px 0}input{vertical-align:middle}
</style>
<main><h1>Beat My Run — locked puffin</h1><p>Hero run and preserved ghost sequence. Select an action to inspect its pose. Both use the same canvas and ground anchor.</p><section><div><div class="stage"><img id="hero" src="hero/run-01.png" alt="Animated hero puffin"></div><p>Hero</p></div><div><div class="stage ghost"><img id="ghost" src="ghost/run-01.png" alt="Animated ghost puffin"></div><p>Ghost · monochrome at 32% opacity</p></div></section><div id="buttons"></div><label>Run speed <input id="speed" type="range" min="6" max="18" value="12"> <span id="fps">12</span> fps</label><img class="sheet" src="hero-contact-sheet.png" alt="All eight hero poses"></main>
<script>
const keys=['run','jump-tuck','flap-up','squish','stunned'];let action='run',fps=12;const hero=document.getElementById('hero'),ghost=document.getElementById('ghost');for(const key of keys){const b=document.createElement('button');b.textContent=key;b.setAttribute('aria-pressed',key===action);b.onclick=()=>{action=key;document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.textContent===key))};document.getElementById('buttons').append(b)}document.getElementById('speed').oninput=e=>{fps=+e.target.value;document.getElementById('fps').textContent=fps};function frame(t){const n=Math.floor(t/1000*fps);hero.src='hero/'+(action==='run'?'run-0'+(n%4+1):action)+'.png';ghost.src='ghost/run-0'+(Math.floor(t/100)%3+1)+'.png';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
